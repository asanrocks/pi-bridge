<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- The app follows the OS preference for its theme (see the media-gated
         dark token block in src/app/index.css). This meta is what keeps the
         pre-stylesheet canvas — and native scrollbars and form controls — on
         the OS side instead of flashing white while the stylesheet loads. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Install metadata. The manifest is what makes the page installable as an
         app (Chromium: name/icons/start_url/display, plus the service worker);
         `/icons/*` and `/favicon.svg` are generated from the pi mark by
         build-icons.ts at build time. The two apple-* tags cover iOS before
         16.4, which ignores `display` in the manifest; everything newer takes
         the icon and standalone mode from the manifest itself. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="pi-bridge" />
    <title>pi-bridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
